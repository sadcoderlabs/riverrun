name: EAS Update (Preview)

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to publish"
        required: false
        default: develop

jobs:
  update:
    name: Publish Preview Update
    runs-on: ubuntu-latest
    environment: develop
    # Run automatically only when tests succeed on a push, or manually via dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish EAS Update
        run: ./scripts/update-preview.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
