name: Upload Version Config to S3

on:
  push:
    branches:
      - main
    paths:
      - "version-config.json"
  workflow_dispatch:

jobs:
  upload:
    name: Upload to S3
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PRODUCTION_WEB_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PRODUCTION_WEB_DEPLOY_ACCESS_KEY_ID }}
          aws-region: "ap-southeast-1"

      - name: Upload version-config.json to S3
        run: |
          aws s3 cp version-config.json s3://${{ secrets.AWS_S3_BUCKET }}/version-config.json \
            --cache-control "max-age=300, must-revalidate" \
            --content-type "application/json"

      - name: Verify upload
        run: |
          echo "✅ version-config.json uploaded successfully to S3"
          echo "🔗 URL: https://s3.ap-southeast-1.amazonaws.com/riverrun.perp.com/version-config.json"
