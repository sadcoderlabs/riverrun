name: EAS Update (Production)

on:
  workflow_run:
    workflows: ['Test']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to publish'
        required: false
        default: main

jobs:
  update:
    name: Publish Production Update
    runs-on: ubuntu-latest
    environment: production
    # Run automatically only when tests succeed on a push, or manually via dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish EAS Update
        run: ./scripts/update-production.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
